<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.w3.org/1999/xhtml"
      th:fragment="layout(title, header, content)">

<head>
    <meta charset="UTF-8">
    <title th:replace="${title}">StomatologyApp</title>
    <style>html { opacity: 0; }</style> 
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>


<body>

<div class="page">

    <header class="header">
        <div class="container headerInner">

            <div class="logo">StomatologyApp</div>

            <nav class="nav">
                <a class="navItem" th:href="@{/doctors}">
                    Врачи
                </a>

                <a class="navItem" th:href="@{/appointments}">
                    Записи
                </a>
            </nav>

            <div class="userBlock">
                <span>
                    Здравствуйте,
                    <span sec:authentication="principal.helloName"></span>
                </span>

                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="logoutBtn">Выйти</button>
                </form>
            </div>

        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h1 th:replace="${header}">Заголовок</h1>
        </div>
    </section>

    <main class="content">
        <div class="container">
            <div th:replace="${content}"></div>
        </div>
    </main>

<footer class="footer">

    <div class="container footerSimple">

        <div class="footerLeft">
            <div class="footerLogo">StomatologyApp</div>
            <div class="footerText">© 2026</div>
        </div>

        <div class="footerRight">

            <div>тел: +971 50 123 4567</div>
            <div>email: clinic@stomatologyapp.com</div>

            <div class="footerTg">
                Telegram:
                <a href="https://t.me/sofiykaz0ldic">@sofiykaz0ldic</a>,
                <a href="https://t.me/savvaguss">@savvaguss</a>,
                <a href="https://t.me/DiDi_050">@DiDi_050</a>
            </div>

        </div>

    </div>

</footer>
</div>

<script src="/js/script.js"></script>

</body>
</html>
