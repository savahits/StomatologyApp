<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.w3.org/1999/xhtml">

<head>
    <title th:fragment="title">Добавление доктора</title>
</head>

<body class="doctorPage">

<th:block th:replace="~{layout :: layout (~{::title}, ~{::header}, ~{::content})}">

    <th:block th:fragment="header">
        <div class="pageSectionHeader">
            <h1>Добавить доктора</h1>
        </div>
    </th:block>

    <th:block th:fragment="content">

        <div class="container">

            <form class="form doctorForm"
                  th:action="@{/doctors}"
                  method="post"
                  th:object="${doctor}">

                <h2>Новый доктор</h2>

                <div th:if="${#fields.hasGlobalErrors()}" class="formErrors">
                    <strong>Пожалуйста, исправьте ошибки:</strong>
                    <ul>
                        <li th:each="err : ${#fields.globalErrors()}"
                            th:text="${err.defaultMessage}">
                        </li>
                        </li>
                    </ul>
                </div>

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>

                <div class="formGrid">

                    <div class="formRow">
                        <label>Имя</label>
                        <input type="text" th:field="*{name}">
                        <div th:errors="*{name}" class="field-error"></div>
                    </div>

                    <div class="formRow">
                        <label>Логин</label>
                        <input type="text" th:field="*{username}">
                        <div th:errors="*{username}" class="field-error"></div>
                    </div>

                    <div class="formRow">
                        <label>Фамилия</label>
                        <input type="text" th:field="*{surname}">
                        <div th:errors="*{surname}" class="field-error"></div>
                    </div>

                    <div class="formRow">
                        <label>Отчество</label>
                        <input type="text" th:field="*{patronymic}">
                        <div th:errors="*{patronymic}" class="field-error"></div>
                    </div>

                    <div class="formRow">
                        <label>Телефон</label>
                        <input type="text" th:field="*{phone}">
                        <div th:errors="*{phone}" class="field-error"></div>
                    </div>

                    <div class="formRow">
                        <label>Пароль</label>
                        <input type="password" th:field="*{password}">
                        <div th:errors="*{password}" class="field-error"></div>
                    </div>

                    <div class="formRow full">
                        <label>Специализация</label>
                        <select th:field="*{specializationId}">
                            <option value="">Выберите специализацию</option>
                            <option th:each="spec : ${specializations}"
                                    th:value="${spec.id}"
                                    th:text="${spec.name}">
                            </option>
                        </select>
                        <div th:errors="*{specializationId}" class="field-error"></div>
                    </div>

                </div>

                <div class="doctor-actions">
                    <button type="submit" class="button button-primary">
                        Создать
                    </button>

                    <a href="/doctors" class="button button-secondary">
                        Назад
                    </a>
                </div>

            </form>

        </div>

    </th:block>

</th:block>

</body>
</html>
